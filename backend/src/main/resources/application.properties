spring.datasource.url=jdbc:sqlite:student_scores.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Email Configuration (Replace with your actual credentials for production)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_16_digit_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Static files location (serving the frontend)
spring.web.resources.static-locations=file:../StudentScoreManagement/

server.port=8080
